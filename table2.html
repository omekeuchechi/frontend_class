<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 2 class</title>

    <style>
        table{
            border-width: 1px;
            border-style: solid;
            border-color: black;
            border-collapse: collapse;
        }

        th{
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 5px;
            padding-right: 5px;
            border-width: 1px;
            border-style: solid;
            border-color: black;
        }

        td{
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 5px;
            padding-right: 5px;
            border-width: 1px;
            border-style: solid;
            border-color: black;
        }
        

    </style>
</head>
<body>
    <table>
        <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Johndoe@gmail.com</td>
            <td>John Doe</td>
            <td>25</td>
        </tr>

        <tr>
            <td>Peter124@gmail.com</td>
            <td>Peter</td>
            <td>23</td>
        </tr>

        <tr>
            <td>Pascalthiago@gmail.com</td>
            <td>Thiago Pascal</td>
            <td>21</td>
        </tr>

        <tr>
            <td>Youngsammy56@gmail.com</td>
            <td>Sammy</td>
            <td>24</td>
        </tr>
    </table>
</body>
</html>
